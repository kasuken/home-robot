# Copy this file to config/laika.toml (ignored by git) and fill in your key.
# Every setting is optional; missing ones use the defaults shown here.

[ai]
# provider: "openai" (default), "azure" or "openai-compatible".
# Cloud endpoints must use HTTPS; plain http:// is only accepted for localhost,
# *.local, *.lan and private IP addresses.
provider = "openai"
base_url = "https://api.openai.com/v1"
# Or leave empty and set OPENAI_API_KEY in the environment.
# With sudo, use `sudo -E` or the environment is dropped.
api_key = ""
model = "gpt-4o-mini"
timeout_s = 20
# How many question/answer pairs Laika remembers within one conversation.
max_history_turns = 8
temperature = 0.8
# true: the model acts through validated tools (needs a model with tool calling).
# false: the older mode where it replies with JSON {"say", "actions"}.
use_tools = true

# Other providers (replace the lines above):
#
# Azure OpenAI: the deployment name stands in for the model.
#   provider = "azure"
#   base_url = "https://my-resource.openai.azure.com"
#   azure_deployment = "my-gpt-deployment"
#   azure_api_version = "2024-10-21"
#
# LM Studio on another machine (no key needed):
#   provider = "openai-compatible"
#   base_url = "http://<lan-ip>:1234/v1"
#   model = "the-model-loaded-in-lm-studio"
#
# Ollama (OpenAI-compatible /v1):
#   provider = "openai-compatible"
#   base_url = "http://<lan-ip>:11434/v1"
#   model = "llama3.1"
#
# vLLM works like LM Studio. Set api_key only if the server requires one.

[voice]
# Vosk speech recognition language (downloaded on first run, ~50 MB).
stt_language = "it"
# "edge": Microsoft's free online voices (natural, needs internet). If Edge fails,
#         Laika says that sentence with the offline Piper voice instead.
# "piper": the offline voice only.
tts_engine = "edge"
# Edge voice: "it-IT-IsabellaNeural" or "it-IT-ElsaNeural" (female), "it-IT-DiegoNeural" (male).
edge_voice = "it-IT-IsabellaNeural"
# Piper voice: "it_IT-paola-medium" (female) or "it_IT-riccardo-x_low" (male, faster).
tts_model = "it_IT-paola-medium"
# Watch the "[laika] heard:" lines; if Vosk writes the name differently, add it here.
wake_names = ["laika", "laica"]
wake_greeting = "Dimmi."
welcome = "Laika è online. Per svegliarmi, dite: ehi Laika."
goodbye = "Va bene. Torno a fare la guardia."
sleep_words = ["basta", "stop", "dormi", "fine", "a dopo"]
# Seconds Laika keeps listening for a follow-up before going back to sleep.
follow_up_s = 8

[robot]
# Safety values: what each one does, its range and how to calibrate them on the robot are in
# docs/safety-calibration.md. Out-of-range values stop Laika at startup with a message.
# Set to false to keep the wheels still (head and steering gestures only).
allow_driving = true
# Wheel speed of a move, 1 to 40.
drive_speed = 25
# Longest forward move, 0.1 to 3 s (a single move is also capped at 1.5 s).
max_drive_s = 1.5
# Longest backward move, 0.1 to 1 s: there is no rear sensor.
backward_max_s = 0.6
# Forward moves are refused or stopped when something is closer than this, 10 to 100 cm.
min_front_distance_cm = 25
# A move that waits longer than this before it starts is dropped, 0.2 to 5 s.
command_max_age_s = 1.0
# How often the safety monitor reads the sensors while a move runs, 10 to 50 Hz.
safety_cadence_hz = 20
# Consecutive invalid ultrasonic readings during a forward move that stop it, 1 to 50 (0 = off).
ultrasonic_invalid_limit = 5
honk_volume = 80
# The watchdog stops the motors if the safety monitor stalls this long, 0.2 to 2 s (0 = off).
watchdog_timeout_s = 0.5
# Grayscale values at or below these read as a cliff (0 to 4095 each). The hardware check
# prints a suggested line for this: uncomment it, or paste the printed line.
# cliff_reference = [525, 525, 525]
# Small random head movements while Laika talks.
talk_motion = true

[camera]
# Photos are taken on request only, never streamed. Size is clamped to 1280x960.
width = 640
height = 480
jpeg_quality = 80
# A request sooner than this after the last photo gets the previous one back.
min_interval_s = 0.5
max_per_minute = 30
# false: describe photos but do not keep the files.
save_images = true

[storage]
# Where Laika keeps images, logs and memory. Empty: $LAIKA_DATA_DIR, else
# $XDG_DATA_HOME/laika, else ~/.local/share/laika. Under sudo "~" is /root, so
# set LAIKA_DATA_DIR (the systemd service sets it, e.g. /var/lib/laika).
# The environment variable wins over this setting.
data_dir = ""
# Camera images: the oldest are deleted beyond either limit.
max_images = 200
max_images_mb = 100
# The event log (logs/events.jsonl) rotates at this size and keeps this many old files.
log_max_mb = 5
log_backups = 3
# Off by default for privacy: a transcript stores what people said, children included.
# When true, each turn is appended to logs/transcripts-YYYY-MM-DD.jsonl and files
# older than max_transcript_days are deleted.
keep_transcripts = false
max_transcript_days = 7
